velocity_rc_override:
{
    enabled = true;
    require_poshold = true;
    frame_id = "auv_base_link";

    # KCL runs at 100 Hz (dt = 0.01 s). Keep the MAVLink pilot-input stream at
    # the same rate to avoid adding another sample-and-hold delay.
    rate_hz = 100.0;
    command_timeout_s = 0.25;

    # KCL command order in ROS FLU:
    # forward, left, up, roll rate, pitch rate, counter-clockwise yaw rate.
    velocity_min_flu = [-2.0, -1.8, -0.55, -2.0, -2.2, -1.85];
    velocity_max_flu = [ 2.0,  1.8,  0.55,  2.0,  2.2,  1.85];

    # ArduSub RCMAP order: roll, pitch, throttle, yaw, forward, lateral.
    rc_channels = [1, 2, 3, 4, 6, 7];

    # Axis order: forward, lateral/right, vertical/up, yaw/clockwise.
    pwm_min = [1100, 1100, 1100, 1100];
    pwm_neutral = [1500, 1500, 1500, 1500];
    pwm_max = [1900, 1900, 1900, 1900];

    # Neutral roll and pitch input (zero requested attitude).
    attitude_neutral_pwm = 1500;
};
